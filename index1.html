<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>apps work space</title>
    <script src="js/alpine_3.x.x.min.js" defer></script>
    <script src="database/datos.js"></script>
    <script src="js/script.js"></script>
    <script src="css/tailwind_3.4.17.min.css"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">

</head>

<body x-data="inactivity" x-init="init()" x-bind:class="{'dark': $store.theme.dark, 'light': !$store.theme.dark}" class="">

    <!-- Modal de Inactividad -->
    <div x-show="isLocked" x-trap.noscroll="isLocked" class="modal-overlay fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50" style="display: none;">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-lg shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-4 text-slate-900 dark:text-slate-100">Página Bloqueada</h2>
            <p class="mb-6 text-slate-600 dark:text-slate-300">Por favor, introduce el código para reactivar.</p>
            <form @submit.prevent="unlockPage()">
                <input x-ref="codeInput" type="password" x-model="inputCode" value="2025" class="w-full px-4 py-2 border rounded-md dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p x-show="errorMessage" x-text="errorMessage" class="text-red-500 text-sm mt-2"></p>
                <button type="submit" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors">
                    Desbloquear
                </button>
            </form>
        </div>
    </div>

    <div :class="{ 'pointer-events-none blur-sm': isLocked }">
        <div class="min-h-screen text-slate-900 
        bg-gradient-to-b from-white via-pink-100 to-indigo-200 
        dark:bg-gradient-to-t dark:from-blue-900 dark:via-slate-900 dark:to-slate-900 
        dark:text-slate-100">
        <div class="container mx-auto px-4 py-3">

            <header class="p-4 rounded-full mb-5">
                <div class="flex justify-between items-center">
                    <a href="https://myaccount.google.com/" target="_blank" class="text-xl font-bold flex items-center"
                        title="ir a Mi Cuenta">
                        <img class="image" data-alt-override="false"
                            alt="El logotipo de Google, que está conformado por la letra &quot;G&quot; en color verde, rojo, amarillo y azul."
                            srcset="https://www.gstatic.com/marketing-cms/assets/images/bc/1a/a310779347afa1927672dc66a98d/g.png=s48-fcrop64=1,00000000ffffffff-rw 1x,https://www.gstatic.com/marketing-cms/assets/images/bc/1a/a310779347afa1927672dc66a98d/g.png=s96-fcrop64=1,00000000ffffffff-rw 2x"
                            width="38" height="38" fetchpriority=""
                            src="https://www.gstatic.com/marketing-cms/assets/images/bc/1a/a310779347afa1927672dc66a98d/g.png=s48-fcrop64=1,00000000ffffffff-rw">
                        <span class="ml-2">apps work space</span>
                    </a>
                    <div class="relative group">
                        <button @click="$store.theme.toggle()"
                            class="relative inline-flex items-center h-6 rounded-full w-11 transition-colors duration-300 focus:outline-none"
                            :class="$store.theme.dark ? 'bg-blue-600' : 'bg-slate-300 dark:bg-slate-600'">
                            <span class="sr-only">Toggle Dark Mode</span>
                            <span
                                class="inline-block w-4 h-4 transform bg-white rounded-full transition-transform duration-300"
                                :class="$store.theme.dark ? 'translate-x-6' : 'translate-x-1'"></span>
                        </button>
                        <div
                            class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 w-max bg-slate-700 text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-10">
                            Cambiar a modo claro/oscuro
                        </div>
                    </div>
                </div>
            </header>
            <main class="p-4">

                <div x-data="linkList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-transparent dark:bg-transparent p-4 rounded">
                        <h2 class="text-xl font-bold mb-4 text-center">work</h2>
                        <div class="grid grid-cols-2 grid-rows-4 gap-3 h-80">
                            <template x-for="link in appswork" :key="link.id">
                                <a x-html="`${link.img} <span class='ml-2 text-slate-600 dark:text-slate-100' x-text='link.text'></span>`"
                                    :href="link.href" :aria-label="link.label" tabindex="0"
                                    class="bg-white rounded flex pl-3 dark:bg-slate-800 items-center hover:scale-105 transition-transform duration-200"
                                    target="_blank" rel="noopener noreferrer">
                                </a>
                            </template>
                        </div>
                    </div>
                    <div class="bg-transparent dark:bg-transparent p-4 rounded">
                        <h2 class="text-xl font-bold mb-4 text-center">space</h2>
                        <div class="grid grid-cols-2 grid-rows-4 gap-3 h-80">
                            <template x-for="link in appspace" :key="link.id">
                                <a x-html="`${link.img} <span class='ml-2 text-slate-600 dark:text-slate-100' x-text='link.text'></span>`"
                                    :href="link.href" :aria-label="link.label" tabindex="0"
                                    class="bg-white rounded flex pl-3 dark:bg-slate-800 items-center hover:scale-105 transition-transform duration-200"
                                    target="_blank" rel="noopener noreferrer">
                                </a>
                            </template>
                        </div>
                    </div>
                </div>

                <div x-data="buttonList" class="justify-center items-center text-center my-8 pt-4">
                    <template x-for="button in buttonsgoogle" :key="button.id">
                        <button @click="window.open(button.link, '_blank')"
                            class="bg-blue-700/50 text-white font-bold py-2 px-4 rounded-full dark:text-slate-100 dark:bg-blue-900/50"
                            x-bind:class="button.class">
                            <span x-html="button.text"></span>
                        </button>
                    </template>
                </div>

                <div x-data="linkList"
                    class="grid grid-cols-1 md:grid-cols-6 gap-4 bg-transparent dark:bg-transparent p-4 rounded">
                    <template x-for="link in appothers" :key="link.id">
                        <a :href="link.href" target="_blank" rel="noopener noreferrer" class="flip-card h-24" :aria-label="link.label" tabindex="0">
                            <div class="flip-card-inner rounded">
                                <div x-html="link.img" class="flip-card-front bg-transparent dark:bg-transparent rounded flex items-center justify-center">
                                </div>
                                <div class="flip-card-back bg-white/75 dark:bg-blue-950/75 rounded flex items-center justify-center dark:shadow">
                                    <span class="text-slate-600 dark:text-slate-100" x-text="link.text"></span>
                                </div>
                            </div>
                        </a>
                    </template>
                </div>

                <div x-data="buttonList" class="flex justify-center items-center my-8">
                    <template x-for="button in buttonsdev" :key="button.id">
                        <button @click="window.open(button.link, '_blank')"
                            class="bg-blue-700/50 text-white font-bold py-2 px-4 rounded-full dark:text-slate-100 dark:bg-blue-900"
                            x-bind:class="button.class">
                            <span x-html="button.text"></span>
                        </button>
                    </template>
                </div>

            </main>
            <footer>
            </footer>

        </div>
        </div>
    </div>
</body>

</html>
