<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>apps work space</title>
    <script src="js/alpine_3.x.x.min.js" defer></script>
    <script src="database/datos.js"></script>
    <script>

        document.addEventListener('alpine:init', () => {

            Alpine.store('theme', {
                dark: window.localStorage.getItem('dark') === 'true',

                toggle() {
                    this.dark = !this.dark;
                    window.localStorage.setItem('dark', this.dark);
                    // Forzar el reinicio de la animación del encabezado
                    const header = document.querySelector('header');
                    // 1. Quitar la animación actual
                    header.style.animation = 'none';
                    // 2. Forzar un "reflow" para que el navegador aplique el cambio
                    void header.offsetWidth;
                    // 3. Volver a aplicar la animación para que se reinicie
                    header.style.animation = 'gradientShift 5s ease';
                }
            });

            Alpine.data('linkList', () => ({
                appswork: linksData.slice(0, 6),
                appspace: linksData.slice(6, 12),
                appothers: linksData.slice(12, linksData.length),
            }))

            Alpine.data('buttonList', () => ({
                buttonsgoogle: linksButton.slice(0, 2),
                buttonsdev: linksButton.slice(2, 5),
            }))
        });

    </script>
    <script src="css/tailwind_3.4.17.min.css"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .flip-card {
            background-color: transparent;
            width: 100%;
            aspect-ratio: 1 / 1;
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        .flip-card-front img, .flip-card-front svg {
            width: 50% !important;
            height: 50% !important;
            object-fit: contain !important;
        }

        .grid.grid-cols-2 img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        @keyframes spinY {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .grid.grid-cols-2 a:hover img.spin {
            animation: spin 1s linear infinite;
        }

        .grid.grid-cols-2 a:hover img.spinY {
            animation: spinY 1s linear infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dark header {
            background: linear-gradient(45deg, #0f172a, #0f172a, #0f172a, #0f172a, #85D489, #F8DC32, #4796E3, #CA6673, #9177C7, #FFCBE5, #96B6C5);
            background-size: 400% 400%;
            animation: gradientShift 5s ease;
        }

        header {
            background: linear-gradient(45deg, #f3f4f6, #f3f4f6, #f3f4f6, #f3f4f6, #85D489, #F8DC32, #4796E3, #CA6673, #9177C7, #FFCBE5, #96B6C5);
            background-size: 400% 400%;
            animation: gradientShift 5s ease;
        }
    </style>
</head>

<body x-data x-bind:class="{'dark': $store.theme.dark, 'light': !$store.theme.dark}" class="transition-colors duration-300">
    <div class="min-h-screen bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
        <div class="container mx-auto px-4 py-3">

            <header class="p-4 shadow-md bg-gray-100 dark:bg-gray-800 rounded-full dark:border dark:border-gray-700">
                <div class="flex justify-between items-center">
                    <a href="https://myaccount.google.com/" target="_blank" class="text-xl font-bold flex items-center"
                        title="ir a Mi Cuenta">
                        <img class="image" data-alt-override="false"
                            alt="El logotipo de Google, que está conformado por la letra &quot;G&quot; en color verde, rojo, amarillo y azul."
                            srcset="https://www.gstatic.com/marketing-cms/assets/images/bc/1a/a310779347afa1927672dc66a98d/g.png=s48-fcrop64=1,00000000ffffffff-rw 1x,https://www.gstatic.com/marketing-cms/assets/images/bc/1a/a310779347afa1927672dc66a98d/g.png=s96-fcrop64=1,00000000ffffffff-rw 2x"
                            width="38" height="38" fetchpriority=""
                            src="https://www.gstatic.com/marketing-cms/assets/images/bc/1a/a310779347afa1927672dc66a98d/g.png=s48-fcrop64=1,00000000ffffffff-rw">
                        <span class="ml-2">apps work space</span>
                    </a>
                    <div class="relative group">
                        <button @click="$store.theme.toggle()"
                            class="relative inline-flex items-center h-6 rounded-full w-11 transition-colors duration-300 focus:outline-none"
                            :class="$store.theme.dark ? 'bg-blue-600' : 'bg-gray-300 dark:bg-gray-600'">
                            <span class="sr-only">Toggle Dark Mode</span>
                            <span
                                class="inline-block w-4 h-4 transform bg-white rounded-full transition-transform duration-300"
                                :class="$store.theme.dark ? 'translate-x-6' : 'translate-x-1'"></span>
                        </button>
                        <div
                            class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 w-max bg-gray-700 text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-10">
                            Cambiar a modo claro/oscuro
                        </div>
                    </div>
                </div>
            </header>
            <main class="p-4">

                <div x-data="linkList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded dark:border dark:border-gray-600">
                        <h2 class="text-xl font-bold mb-4 text-center">work</h2>
                        <div class="grid grid-cols-2 grid-rows-3 gap-3 h-64">
                            <template x-for="link in appswork" :key="link.id">
                                <a x-html="`${link.img} <span class='ml-2 text-slate-600 dark:text-slate-100' x-text='link.text'></span>`"
                                    :href="link.href" :aria-label="link.label" tabindex="0"
                                    class="bg-white rounded flex pl-3 border-r-4 dark:bg-slate-600 items-center hover:scale-105 transition-transform duration-200"
                                    x-bind:class="link.border" target="_blank" rel="noopener noreferrer">
                                </a>
                            </template>
                        </div>
                    </div>
                    <div class="bg-gray-100 dark:bg-gray-700 p-4 rounded dark:border dark:border-gray-600">
                        <h2 class="text-xl font-bold mb-4 text-center">space</h2>
                        <div class="grid grid-cols-2 grid-rows-3 gap-3 h-64">
                            <template x-for="link in appspace" :key="link.id">
                                <a x-html="`${link.img} <span class='ml-2 text-slate-600 dark:text-slate-100' x-text='link.text'></span>`"
                                    :href="link.href" :aria-label="link.label" tabindex="0"
                                    class="bg-white rounded flex pl-3 border-r-4 dark:bg-slate-600 items-center hover:scale-105 transition-transform duration-200"
                                    x-bind:class="link.border" target="_blank" rel="noopener noreferrer">
                                </a>
                            </template>
                        </div>
                    </div>
                </div>

                <div x-data="buttonList" class="justify-center items-center text-center my-7">
                    <template x-for="button in buttonsgoogle" :key="button.id">
                        <button @click="window.open(button.link, '_blank')"
                            class="bg-blue-500 hover:bg-blue-700 text-white dark:text-slate-100 font-bold py-2 px-4 rounded-full dark:bg-blue-700 dark:hover:bg-blue-500"
                            x-bind:class="button.class">
                            <span x-html="button.text"></span>
                        </button>
                    </template>
                </div>

                <div x-data="linkList"
                    class="grid grid-cols-1 md:grid-cols-6 gap-4 bg-gray-100 dark:bg-gray-900 p-4 rounded">
                    <template x-for="link in appothers" :key="link.id">
                        <a :href="link.href" target="_blank" rel="noopener noreferrer" class="flip-card h-24" :aria-label="link.label" tabindex="0">
                            <div class="flip-card-inner rounded">
                                <div x-html="link.img" class="flip-card-front bg-white dark:bg-slate-600 rounded border-r-4 flex items-center justify-center" x-bind:class="link.border">
                                </div>
                                <div class="flip-card-back bg-white dark:bg-slate-600 rounded border-r-4 flex items-center justify-center" x-bind:class="link.border">
                                    <span class="text-slate-600 dark:text-slate-100" x-text="link.text"></span>
                                </div>
                            </div>
                        </a>
                    </template>
                </div>

                <div x-data="buttonList" class="flex justify-center items-center my-7">
                    <template x-for="button in buttonsdev" :key="button.id">
                        <button @click="window.open(button.link, '_blank')"
                            class="bg-blue-500 hover:bg-blue-700 text-white dark:text-slate-100 font-bold py-2 px-4 rounded-full dark:bg-blue-700 dark:hover:bg-blue-500"
                            x-bind:class="button.class">
                            <span x-html="button.text"></span>
                        </button>
                    </template>
                </div>

            </main>
            <footer>
            </footer>

        </div>
    </div>
</body>

</html>
